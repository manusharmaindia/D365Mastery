<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Background subtle soft glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3E8FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Violet to Bright Purple Gradient for D base -->
    <linearGradient id="grad-d-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="45%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Inner Ribbon Loop Gradient -->
    <linearGradient id="grad-ribbon-loop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Right M Arch Gradient -->
    <linearGradient id="grad-m-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>

    <!-- Soft 3D Drop Shadow -->
    <filter id="ribbon-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#3B0764" flood-opacity="0.18"/>
    </filter>
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#2E1065" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="220" r="180" fill="url(#bg-glow)" />

  <!-- The DM Interlocking Ribbon Mark -->
  <g filter="url(#ribbon-shadow)">
    <!-- Left 'D' Back Arch -->
    <path d="M140 120 H195 C250 120 280 155 280 215 C280 275 245 310 190 310 H140 V120 Z" fill="url(#grad-d-main)"/>

    <!-- 'D' Inner Counter Cutout (Darkened Core) -->
    <path d="M185 165 H195 C225 165 240 185 240 215 C240 245 220 265 190 265 H185 V165 Z" fill="#3B0764" opacity="0.3"/>

    <!-- The 3D Twisting Ribbon through center -->
    <path d="M185 270 C205 270 230 250 250 220 C270 190 285 160 315 160 C345 160 360 185 350 220 C340 255 310 275 280 275 C250 275 225 245 225 215 C225 185 245 160 270 160" 
          stroke="url(#grad-ribbon-loop)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#inner-shadow)"/>

    <!-- The 'M' Right Pillar & Arch Flow -->
    <path d="M305 170 C325 135 365 125 390 155 C410 180 415 220 415 280 C415 295 405 310 390 310 C375 310 365 295 365 275 C365 230 360 185 340 185 C320 185 305 220 300 250" 
          stroke="url(#grad-m-right)" stroke-width="46" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography: D365Mastery -->
  <text x="250" y="395" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="52" fill="#2E1065" letter-spacing="-1.5">
    D365<tspan fill="#6D28D9">Mastery</tspan>
  </text>
</svg>
